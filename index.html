<!DOCTYPE html> 
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale = 1.0">
    <title>Paarfuss Inventur</title>

    <style>
        /* Legt das Foto als Bezugspunkt für den darüberliegenden Scanrahmen fest. */
        .barcode-foto-bereich
        {
            position: relative;
            max-width: 100%;
        }

        .barcode-foto-bereich[hidden]
        {
            display: none;
        }

        .barcode-foto-bereich img
        {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Markiert den Bildbereich, der für den ersten Erkennungsversuch ausgeschnitten wird. */
        .barcode-scanrahmen
        {
            position: absolute;
            top: 40%;
            left: 5%;
            width: 90%;
            height: 20%;
            border: 3px solid red;
            box-sizing: border-box;
            pointer-events: none;
        }
    </style>

</head>
   <body>
    <header>
        <h1>Paarfuss Lager</h1>
    </header>

    <!-- Diese Navigation wechselt zwischen den vier Hauptbereichen. -->
    <nav aria-label="Hauptnavigation">
        <button onclick="ansichtWechseln('startAnsicht')">Start</button>
        <button onclick="ansichtWechseln('lagerAnsicht')">Lager</button>
        <button onclick="ansichtWechseln('inventurAnsicht')">Inventur</button>
        <button onclick="ansichtWechseln('nachbestellAnsicht')">Nachbestellen</button>
    </nav>

    <main>
        <section id="startAnsicht" class="app-ansicht">
            <h2>Start</h2>
            <p>Willkommen bei Paarfuss Lager.</p>
        </section>

        <section id="lagerAnsicht" class="app-ansicht" hidden>
            <h2>Lager</h2>
            <h3>Neues Produkt hinzufügen</h3>

            <!-- Dieses Formular wird zum Hinzufügen und Bearbeiten verwendet. -->
            <input id="artikelnummerEingabe" placeholder="Artikelnummer">
            <input id="barcodeEingabe" placeholder="Barcode">
            <input id="nameEingabe" placeholder="Produktname">
            <input id="bestandEingabe" placeholder="Bestand" type="number">
            <input id="mindestbestandEingabe" placeholder="Mindestbestand" type="number">
            <button id="formularButton" onclick="produkthinzufügen()">Produkt hinzufügen</button>
            <button onclick="formularZurücksetzen()">Abbrechen</button>

            <h3>Produktliste</h3>

            <!-- Live-Scanner für flache Barcodes. -->
            <input id="sucheEingabe" placeholder="Name, Artikelnummer oder Barcode" oninput="produkteAnzeigen()">

            <div id="lagerScannerPlatz">
            <div id="scannerBereich">
            <button id="scannerStartButton" onclick="scannerStarten()">Barcode scannen</button>
            <button id="scannerStopButton" onclick="scannerStoppen()" hidden>Scanner schließen</button>
            <p id="scannerMeldung"></p>
            <video id="scannerVideo" playsinline hidden></video>

            <!-- Foto-Scanner für gekrümmte Barcodes. -->
            <button onclick="document.getElementById('barcodeFotoEingabe').click()">Barcode fotografieren</button>
            <input id="barcodeFotoEingabe" type="file" accept="image/*" capture="environment"
                onchange="barcodeFotoAnzeigen(this)" hidden>

            <p id="fotoMeldung"></p>
            <button id="barcodeManuellButton" onclick="barcodeManuellEingeben()" hidden>
                Barcode manuell eingeben
            </button>

            <div id="barcodeFotoBereich" class="barcode-foto-bereich" hidden>
                <img id="barcodeFotoVorschau" alt="Aufgenommenes Barcode-Foto">
                <div class="barcode-scanrahmen"></div>
            </div>
        </div>
    </div>  
            <select id="sortierungAuswahl" onchange="sortierungAendern()">
                <option value="name">Nach Name sortieren</option>
                <option value="bestand">Nach Bestand sortieren</option>
                <option value="nachbestellen">Nachbestellen zuerst</option>
            </select>

            <p id="übersicht"></p>

            <label>
                <input id="nurNachbestellen" type="checkbox" onchange="produkteAnzeigen()">
                Nur nachzubestellende Produkte anzeigen
            </label>

            <div id="produktListe"></div>
        </section>

        <section id="inventurAnsicht" class="app-ansicht" hidden>
            <h2>Inventur</h2>
            <button id="inventurStartButton" onclick="inventurStarten()">Inventur starten</button>
            <button id="inventurAbbruchButton" onclick="inventurAbbrechen()" hidden>Inventur abbrechen</button>
            <p id="inventurMeldung">Keine Inventur aktiv.</p>
            <div id="inventurScannerPlatz"></div>
            <div id="inventurErfassung" hidden>
            <input id="inventurBarcodeEingabe" placeholder="Barcode eingeben" inputmode="numeric">
            <button onclick="inventurBarcodeBuchen()">Artikel zählen</button>
            <p id="inventurScanMeldung"></p>
            </div>
            <div id="inventurUnbekannteBereich" hidden>
                <h3>Unbekannte Barcodes</h3>
                <div id="inventurUnbekannteListe"></div>
            </div>
        </section>

        <section id="nachbestellAnsicht" class="app-ansicht" hidden>
            <h2>Nachbestellen</h2>
            <div id="nachbestellListe"></div>
        </section>
    </main>

    <script src="https://unpkg.com/@zxing/browser@0.2.0/umd/zxing-browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.2/dist/iife/reader/index.js"></script>  
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/7.0.0/tesseract.min.js"></script>

    <script>
        //Zeigt eine Hauptansicht und versteckt alle anderen.
        function ansichtWechseln(ansichtId)
        {
            let ansichten = document.querySelectorAll(".app-ansicht");

            for (let i = 0; i < ansichten.length; i++)
            {
                ansichten[i].hidden = ansichten[i].id !== ansichtId;
            }

            let scannerBereich = document.getElementById("scannerBereich");

            if (ansichtId === "lagerAnsicht")
            {
              let lagerScannerPlatz = document.getElementById("lagerScannerPlatz");
                lagerScannerPlatz.appendChild(scannerBereich);
                produkteAnzeigen();
            }

            if (ansichtId === "inventurAnsicht")
            {
               let inventurScannerPlatz = document.getElementById("inventurScannerPlatz");
                inventurScannerPlatz.appendChild(scannerBereich);
                inventurAnzeigeAktualisieren();
            }

            if (ansichtId === "nachbestellAnsicht")
            {
                nachbestellungenAnzeigen();
            }
        }

        // Beim Start dienen Testprodukte als Fallback; gespeicherte Daten ersetzen sie später.
        let produkte = standardProdukte();

        // null bedeutet Hinzufügen; eine Zahl verweist auf das Produkt im Bearbeitungsmodus.
        let bearbeitungsIndex = null;
        let sortierung = "name";

        // Hält den Zustand einer laufenden Inventur getrennt vom echten Lagerbestand.
        let inventur = {
            aktiv: false,
            gestartetAm: null,
            positionen: [],
            unbekannteBarcodes: []
        };

        // Laufende Kamera- und OCR-Instanzen werden zentral verwaltet.
        let scannerSteuerung = null; 
        let scannerLeser = null;
        let ocrWorker = null;

        // Liefert Testprodukte, wenn im Browser noch keine eigenen Produkte gespeichert sind.
        function standardProdukte()
        {
            return[
                                              
            {
                artikelnummer: "FC-001",
                barcode: "",
                name: "Fußcreme",
                bestand: 5,
                mindestbestand: 2
            },
            {
                artikelnummer: "HS-001",
                barcode: "",
                name: "Handschuhe",
                bestand: 20,
                mindestbestand: 10
            },
            {
                artikelnummer: "DES-001",
                barcode: "",
                name: "Desinfektionsmittel",
                bestand: 3,
                mindestbestand: 4
            }
        
            ];
        }

        // Aktiviert kontinuierlichen Fokus nur, wenn die verwendete Kamera ihn unterstützt.
        async function kameraOptimieren(video)
    {
        if (!video.srcObject)
        {
            return;
        }

        let kameraSpuren = video.srcObject.getVideoTracks();

        if (kameraSpuren.length === 0)
        {
            return;
        }

        let kameraSpur = kameraSpuren[0];

        if (typeof kameraSpur.getCapabilities !== "function")
        {
             return;
        }

        let faehigkeiten = kameraSpur.getCapabilities();
        let einstellungen = {};

        if (
            Array.isArray(faehigkeiten.focusMode) &&
            faehigkeiten.focusMode.includes("continuous")
        )
        {
            einstellungen.focusMode = "continuous";
        }

        if (Object.keys(einstellungen).length > 0)
        {
            try
            {
                await kameraSpur.applyConstraints({
                    advanced: [einstellungen]
                });
            }
            catch (fehler)
            {
                console.log("Kameraoptimierung nicht unterstützt.", fehler);
            }
        }
    }

        // Zeigt das aufgenommene Foto an und startet die Verarbeitung nach dem Laden.
        function barcodeFotoAnzeigen(eingabe)
        {
            if (eingabe.files.length === 0)
            {
                return;
            }

            let datei = eingabe.files[0];
            let vorschau = document.getElementById("barcodeFotoVorschau");

            // Die temporäre URL zeigt die lokale Datei an, ohne sie hochzuladen.
            let fotoAdresse = URL.createObjectURL(datei);

            vorschau.onload = async function()
            {
                await barcodeFotoVerarbeiten(datei, vorschau);
                URL.revokeObjectURL(fotoAdresse);
            };

            vorschau.src = fotoAdresse;
            

            document.getElementById("barcodeFotoBereich").hidden = false;

            document.getElementById("fotoMeldung").textContent = "Foto aufgenommen. Ziffern werden gelesen...";
        }

        // Schneidet den roten Scanbereich aus dem Originalbild aus und vergrößert ihn zweifach.
        function barcodeAusschnittErstellen(bild)
        {
            let canvas = document.createElement("canvas");
            let context = canvas.getContext("2d");


            // Die Prozentwerte entsprechen exakt Position und Größe des CSS-Scanrahmens.
            let ausschnittX = Math.round(bild.naturalWidth * 0.05);
            let ausschnittY = Math.round(bild.naturalHeight * 0.40);
            let ausschnittBreite = Math.round(bild.naturalWidth * 0.90);
            let ausschnittHöhe = Math.round(bild.naturalHeight * 0.20);


            let vergrößerung = 2;


            canvas.width = ausschnittBreite * vergrößerung;
            canvas.height = ausschnittHöhe * vergrößerung;


            context.imageSmoothingEnabled = true;
            context.imageSmoothingQuality = "high";

            context.drawImage(
                bild,
                ausschnittX,
                ausschnittY,
                ausschnittBreite,
                ausschnittHöhe,
                0,
                0,
                canvas.width,
                canvas.height
            );

            // canvas.toBlob arbeitet asynchron; die Promise liefert anschließend eine Bilddatei.
            return new Promise(function(resolve, reject)
            {
                canvas.toBlob(function(blob)
                {
                    if (blob === null)
                    {
                        reject (new Error("Der Bildausschnitt konnte nicht erstell werden."));
                        return;
                    }

                    let datei = new File (
                        [blob],
                        "barcode-ausschnitt.jpg",
                        {type:"image/jpeg"}
                    );
                resolve (datei);
                },"image/jpeg", 0.95);
                
            });
        }


        // Prüft zuerst den vergrößerten Ausschnitt, danach das ganze Foto und zuletzt die Ziffern.
        async function barcodeFotoVerarbeiten(datei, vorschau)
        {
            let meldung = document.getElementById("fotoMeldung");

            // Begrenzt ZXing auf unterstützte Strichcodes und aktiviert gründlichere Suchvarianten.
            let optionen = {
                formats: [
                    "EAN13",
                    "EAN8",
                    "UPCA",
                    "UPCE",
                    "Code128"
                ],
                tryHarder: true,
                tryRotate: true,
                tryInvert: true,
                tryDownscale: true,
                maxNumberOfSymbols: 1
            };

            try 
            {
                meldung.textContent = "Barcode im markierten Bereich wird gesucht...";

                let ausschnitt = await barcodeAusschnittErstellen(vorschau);
                let ergebnisse = await ZXingWASM.readBarcodes(
                    ausschnitt,
                    optionen
                );

                // Ohne Treffer im Rahmen folgt ein zweiter Versuch mit dem vollständigen Foto.
                if (ergebnisse.length === 0)
                {
                    meldung.textContent = "Barcode wird im vollständigen Foto gesucht..."

                    ergebnisse = await ZXingWASM.readBarcodes(
                        datei,
                        optionen
                    );
                }
                // OCR liest als letzte kostenlose Rückfallebene die aufgedruckten Barcode-Ziffern.
                if (ergebnisse.length === 0)
                {
                    meldung.textContent = "Barcode nicht direkt erkannt. Ziffern werden gelesen..."

                    await barcodeZiffernLesen(vorschau);
                    return;
                }

                let barcode = ergebnisse[0].text.trim();

                if (barcode === "")
                {
                    throw new Error("Der erkannte Barcode ist leer.");
                }

                scanVerarbeiten(barcode, meldung);
                barcodeFotoZurücksetzen();
            }

            catch (fehler)
            {
                console.error("WASM-Fotoerkennung fehlgeschalgen:", fehler);

                meldung.textContent = "Fotoerkennung fehlgeschlagen. Bitte den barcode manuell eingeben.";

                document.getElementById("barcodeManuellButton").hidden = false;
            }
        }

        // Bringt den Benutzer nach einem fehlgeschlagenen Scan direkt zum Barcodefeld.
        function barcodeManuellEingeben()
        {
           let barcodeEingabe;

           let scannerIstInInventur = document.getElementById("inventurScannerPlatz").contains(document.getElementById("scannerBereich"));

           if (inventur.aktiv && scannerIstInInventur)
           {
             document.getElementById("inventurErfassung").hidden = false;

             barcodeEingabe = document.getElementById("inventurBarcodeEingeben");
           }
           else
           {
            barcodeEingabe = document.getElementById("barcodeEingabe");
           }

           barcodeEingabe.scrollIntoView({
                behavior: "smooth",
                block: "center"
           });

           barcodeEingabe.focus();
        }

        // Entfernt Foto, Scanrahmen und manuellen Rückweg nach einer erfolgreichen Verarbeitung.
        function barcodeFotoZurücksetzen()
        {
            let bereich = document.getElementById("barcodeFotoBereich");
            let vorschau = document.getElementById("barcodeFotoVorschau");

            bereich.hidden = true;
            vorschau.removeAttribute("src");

            document.getElementById("barcodeFotoEingabe").value = "";
            document.getElementById("barcodeManuellButton").hidden = true;
        }



        // Berechnet die Prüfziffer eines GTIN-Barcodes und schützt vor falschen OCR-Ergebnissen.
        function prüfzifferIstGültig (barcode)
        {
            let summe = 0;
            let position = 0;

            // Von rechts werden die Nutzzeichen abwechselnd mit 3 und 1 gewichtet.
            for (let i = barcode.length - 2; i >= 0; i--)
            {
                let gewicht = position % 2 === 0 ? 3 : 1;
                summe += Number(barcode[i]) * gewicht;
                position++;
            }

            let prüfziffer = (10 - (summe % 10)) % 10;

            return prüfziffer === Number(barcode[barcode.length - 1]);
        }





        // Liest mögliche Barcode-Ziffern mit Tesseract aus mehreren horizontalen Bildstreifen.
        async function barcodeZiffernLesen(bild) 
        {
            let meldung = document.getElementById("fotoMeldung");
            
            if (typeof Tesseract === "undefined")
            {
                meldung.textContent = "Die Ziffererkennung konnte nicht geladen werden.";
                return;
            }

            try
            {
                // Der Worker wird nur einmal geladen und danach für weitere Fotos wiederverwendet.
                if (ocrWorker === null)
                {
                    meldung.textContent = "Ziffererkennung wird vorbereitet...";
                    ocrWorker = await Tesseract.createWorker("eng");

                    await ocrWorker.setParameters({
                        tessedit_char_whitelist: "0123456789",
                        tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE
                    });
                }

                meldung.textContent = "Ziffern werden erkannt...";

            let erlaubteLängen = [8, 12, 13, 14];
            let startPositionen = [0.10, 0.25, 0.40, 0.55, 0.70];

            let erkannteVersuche = [];

            // Mehrere Höhen gleichen unterschiedlich positionierte Barcodes im Foto aus.
            for (let i = 0; i < startPositionen.length; i++)
            {
                meldung.textContent = "Bildbereich " + (i + 1) + " von " + startPositionen.length + " wird gelesen...";

                let leseBereich = 
                {
                    left: 0,
                    top: Math.round(bild.naturalHeight * startPositionen[i]),
                    width: bild.naturalWidth,
                    height: Math.round(bild.naturalHeight * 0.20)
                };

                let ergebnis = await ocrWorker.recognize(bild, {
                    rectangle: leseBereich
                });

                let ziffern = ergebnis.data.text.replace(/\D/g, "");

                erkannteVersuche.push(ziffern || "nichts");

                // Nur übliche GTIN-Längen mit korrekter Prüfziffer gelten als sicherer Treffer.
                if (erlaubteLängen.includes(ziffern.length) && prüfzifferIstGültig(ziffern))
                {
                    scanVerarbeiten(ziffern, meldung);
                    barcodeFotoZurücksetzen();
                    return;
                }
            }

            meldung.textContent = "Barcode nicht erkannt. Bitte erneut fotografieren oder manuell eingeben";
            document.getElementById("barcodeManuellButton").hidden = false;

            }

            catch(fehler)
            {
                console.error("Die Ziffererkennung ist fehlgeschlagen", fehler);

                meldung.textContent = "Ziffererkennung fehlgeschlagen. Bitte den Barcode manuell eingeben.";

                document.getElementById("barcodeManuellButton").hidden = false;
            }

        }



        // Öffnet die Rückkamera und liest fortlaufend flache 1D-Barcodes aus dem Videobild.
        async function scannerStarten()
        {
            // Verhindert, dass mehrere Kamera-Scanner gleichzeitig gestartet werden.
            if (scannerSteuerung !== null)
            {
                return;
            }

            let video = document.getElementById("scannerVideo");
            let meldung = document.getElementById("scannerMeldung");

            if (typeof ZXingBrowser === "undefined")
            {
                meldung.textContent = "Scanner konnte nicht geladen werden.";
                return;
            }

            video.hidden = false;
            document.getElementById("scannerStartButton").hidden = true;
            document.getElementById("scannerStopButton").hidden = false;

            meldung.textContent = "Kamera wird gestartet...";


            scannerLeser = new ZXingBrowser.BrowserMultiFormatOneDReader();


            try
            {
                // "ideal" bevorzugt diese Werte, erlaubt aber schwächeren Kameras einen Fallback.
                scannerSteuerung = await scannerLeser.decodeFromConstraints(
                {
                    video: {
                        facingMode: {
                        ideal: "environment"
                },
                        width: {
                        ideal: 1920
                },
                        height: {
                        ideal: 1080
                },
                        frameRate: {
                        ideal: 30
                }
            }
                },
                video,
                function(ergebnis)
                {
                    if(ergebnis)
                    {
                        let barcode = ergebnis.getText();

                        scannerStoppen();
                        scanVerarbeiten(barcode, meldung);
                    }
                }
              );
              await kameraOptimieren(video);
              meldung.textContent = "Barcode vor die Kamera halten.";
            }
            
            catch (fehler)
              {
                scannerStoppen();
                meldung.textContent = "Die Kamera konnte nicht gestartet werden.";

                document.getElementById("barcodeManuellButton").hidden = false;
              }

        }

        // Erstellt eine Momentaufnahme aller Sollbestände für eine neue Inventursitzung.
        function inventurStarten()
        {
            if (produkte.length === 0)
            {
                alert ("Es sind keine Produkte für die Inventur vorhanden.");
                return;
            }
            let bestätigung = confirm ("Möchten sie eine neue Inventur starten?");

            if (!bestätigung)
            {
                return;
            }

            inventur.aktiv = true;
            inventur.gestartetAm = new Date().toISOString();
            inventur.positionen = [];
            inventur.unbekannteBarcodes = [];

            // Jede Position beginnt bei null; erwartet bleibt während der Zählung unverändert.
            for (let i = 0; i < produkte.length; i++)
            {
                let produkt = produkte[i];

                inventur.positionen.push({
                    artikelnummer: produkt.artikelnummer,
                    barcode: produkt.barcode,
                    name: produkt.name,
                    erwartet: produkt.bestand,
                    gezählt: 0
                });
            }

            inventurAnzeigeAktualisieren();
        }

        // Verwirft eine laufende Inventur nach Bestätigung, ohne Lagerbestände zu ändern.
        function inventurAbbrechen()
        {
            let bestätigung = confirm("Möchten sie die laufende Inventur wirklich abbrechen?");

            if (!bestätigung)
            {
                return;
            }

            inventur.aktiv = false;
            inventur.gestartetAm = null;
            inventur.positionen = [];
            inventur.unbekannteBarcodes = [];

            inventurAnzeigeAktualisieren();
        }

        //Übergibt einen eingegebenen Barcode an die Inventurzählung
        function inventurBarcodeBuchen()
        {
            let eingabe = document.getElementById("inventurBarcodeEingabe");

            let barcode = eingabe.value.trim();

            if (barcode === "")
            {
                alert ("Bitte einen Barcode eingeben.");
                return;
            }

            inventurProduktZählen(
                barcode, 
                document.getElementById("inventurScanMeldung")
            );

            eingabe.value = "";
            eingabe.focus();
        }

        //Erhöht nur den gezählten Inventurbestand
        function inventurProduktZählen(barcode, meldung)
        {
            for (let i = 0; i < inventur.positionen.length; i++)
            {
                let position = inventur.positionen[i];

                if ((position.barcode || "").trim() === barcode)
                {
                    position.gezählt++;

                    inventurAnzeigeAktualisieren();

                    meldung.textContent = position.name + ": " + position.gezählt + " von " + position.erwartet + " gezählt.";
                    return;
                }
            }
            let unbekannterIndex = -1;

            for (let i = 0; i < inventur.unbekannteBarcodes.length; i++)
            {
                if (inventur.unbekannteBarcodes[i].barcode === barcode)
                {
                    unbekannterIndex = i;
                    break;
                }
            }

            if (unbekannterIndex === -1)
            {
                inventur.unbekannteBarcodes.push({
                    barcode: barcode,
                    anzahl: 1
                });
            }
            else{
                inventur.unbekannteBarcodes[unbekannterIndex].anzahl++;
            }

            inventurAnzeigeAktualisieren();

            meldung.textContent = "Unbekannte Barcode: " + barcode + ". Bitte Produkt kontrollieren.";
        }

        //Zeigt alle während der Inventur gefundenen unbekannten Barcodes an
        function inventurUnbekannteAnzeigen()
        {
            let bereich = document.getElementById("inventurUnbekannteBereich");

            let liste = document.getElementById("inventurUnbekannteListe");

            liste.innerHTML = "";

            if (!inventur.aktiv || inventur.unbekannteBarcodes.length === 0)
            {
                bereich.hidden = true;
                return;
            }

            bereich.hidden = false;

            for(let i = 0; i < inventur.unbekannteBarcodes.length; i++)
            {
                let unbekannterBarcode = inventur.unbekannteBarcodes[i];

                let eintrag = document.createElement("p");

                eintrag.textContent = "Barcode: " + unbekannterBarcode.barcode + " | Gezählt: " + unbekannterBarcode.anzahl;

                liste.appendChild(eintrag);
            }
        }


        // Passt Buttons und Statustext an den aktuellen Inventurzustand an.
        function inventurAnzeigeAktualisieren()
        {
            let startButton = document.getElementById("inventurStartButton");

            let abbruchButton = document.getElementById("inventurAbbruchButton");

            let erfassung = document.getElementById("inventurErfassung");

            let meldung = document.getElementById("inventurMeldung");

            inventurUnbekannteAnzeigen();

            startButton.hidden = inventur.aktiv;
            abbruchButton.hidden = !inventur.aktiv;
            // erfassung.hidden = !inventur.aktiv;

            if (!inventur.aktiv)
            {
                erfassung.hidden = true;
                meldung.textContent = "Keine inventur aktiv.";
                return;
            }

            let gezählteEinheiten = 0;

            for (let i = 0; i < inventur.positionen.length; i++)
            {
                gezählteEinheiten += inventur.positionen[i].gezählt;
            }

            meldung.textContent = "Inventur läuft. Produkte: " + inventur.positionen.length + " | Einheiten gezählt: " + gezählteEinheiten;
        }

        // Ordnet einen Scan einem Produkt zu oder bereitet ein neues Produktformular vor.
        function scanVerarbeiten(barcode, meldung)
        {

            barcode = barcode.trim();

            let scannerIstInInventur = document.getElementById("inventurScannerPlatz").contains(document.getElementById("scannerBereich"));

            if (inventur.aktiv && scannerIstInInventur)
            {
                inventurProduktZählen(barcode, meldung);
                return;
            }

            let produktIndex = -1;

            // Barcodes werden exakt verglichen, damit nur das richtige Produkt gebucht wird.
            for (let i = 0; i < produkte.length; i++)
            {
                let vorhandenerBarcode = (produkte[i].barcode || "").trim();

                if (vorhandenerBarcode === barcode)
                {
                    produktIndex = i;
                    break;
                }
            }
            if (produktIndex !== -1)
            {
                document.getElementById("sucheEingabe").value = barcode;
                document.getElementById("nurNachbestellen").checked = false;

                bestandErhoehen(produktIndex);

                meldung.textContent = produkte[produktIndex].name + ": Bestand wurde auf " + produkte[produktIndex].bestand + " erhöht.";

                return;
            }

            // Ein unbekannter Barcode bereitet das Formular für ein neues Produkt vor.
            formularZurücksetzen();

            document.getElementById("barcodeEingabe").value = barcode;
            document.getElementById("bestandEingabe").value = 1;
            document.getElementById("artikelnummerEingabe").focus();

            meldung.textContent = "Neuer Barcode erkannt: " + barcode +". Bitte Produktdaten ergänzen.";

        }

        // Stoppt Decoder und Kameraspuren und stellt die ursprünglichen Bedienelemente wieder her.
        function scannerStoppen()
        {
            if (scannerSteuerung !== null)
            {
                scannerSteuerung.stop();
                scannerSteuerung = null;
            }

            let video = document.getElementById("scannerVideo");

            if (video.srcObject)
            {
                // Alle Spuren müssen beendet werden, damit das Gerät die Kamera freigibt.
                let spuren = video.srcObject.getTracks();

                for (let i = 0; i < spuren.length; i++)
                {
                    spuren[i].stop();
                }

                video.srcObject = null;
            }

            video.hidden = true;
            document.getElementById("scannerStartButton").hidden = false;
            document.getElementById("scannerStopButton").hidden = true;
            document.getElementById("scannerMeldung").textContent = "";
        }


        
        // Filtert, sortiert und erzeugt die sichtbare Produktliste aus den gespeicherten Daten.
        function produkteAnzeigen() 
        {
            übersichtAktualisieren();

            let liste = document.getElementById("produktListe");
            let suchText = document.getElementById("sucheEingabe").value.toLowerCase();
            let nurNachbestellen = document.getElementById("nurNachbestellen").checked;

            liste.innerHTML = "";

            let angezeigteAnzahl = 0;

            // Die Kopie kann sortiert werden, ohne die Reihenfolge der Originaldaten zu verändern.
            let angezeigteProdukte = [...produkte];


            if (sortierung === "name")
            {
                angezeigteProdukte.sort(function(a, b)
                {return a.name.localeCompare(b.name)});
            }

            if (sortierung === "bestand")
            {
                angezeigteProdukte.sort(function(a, b)
                {return a.bestand - b.bestand});
            }

            if(sortierung === "nachbestellen")
            {
                angezeigteProdukte.sort(function(a, b)
                {   let aMussNachbestelltWerden = a.bestand <= a.mindestbestand;
                    let bMussNachbestelltWerden = b.bestand <= b.mindestbestand;
                    return (bMussNachbestelltWerden - aMussNachbestelltWerden)
                });
            }



            for (let i = 0; i < angezeigteProdukte.length; i++) {
                let produkt = angezeigteProdukte[i];

                // Buttons benötigen den Index im Originalarray, nicht den der sortierten Kopie.
                let originalIndex = produkte.indexOf(produkt);

                // Derselbe Suchtext wird mit Name, Artikelnummer und Barcode verglichen.
                let namePasst = produkt.name.toLowerCase().includes(suchText);

                let artikelnummerPasst = produkt.artikelnummer.toLowerCase().includes(suchText);

                let barcodePasst = produkt.barcode.toLowerCase().includes(suchText);

                if (!namePasst && !artikelnummerPasst && !barcodePasst)
                {
                    continue;
                }

                if(nurNachbestellen && produkt.bestand > produkt.mindestbestand)
                {
                    continue;
                }

                let status = "";

                if (produkt.bestand <= produkt.mindestbestand) {
                    status = "Nachbestellen";
                }

                angezeigteAnzahl++;

                // Erst nach allen Filtern wird das Produkt als HTML an die Liste angehängt.
                liste.innerHTML += `                                                                              
                    <div>
                        <h2>${produkt.name}</h2>
                        <p>Artikelnummer: ${produkt.artikelnummer}</p>
                        <p>Barcode: ${produkt.barcode}</p>
                        <p>Bestand: ${produkt.bestand}</p>
                        <p>Mindestbestand: ${produkt.mindestbestand}</p>
                        <p style="color: red; font-weight: bold;">${status}</p>
                            
                        <button onclick="bestandErhoehen(${originalIndex})">+</button>
                        <button onclick="bestandVerringern(${originalIndex})">-</button>
                        <button onclick="produktEntfernen(${originalIndex})">Löschen</button>
                        <button onclick="produktBearbeiten(${originalIndex})">Bearbeiten</button>
                    </div>
                    <hr>
                `;
            }

            if (angezeigteAnzahl === 0) 
            {
                liste.innerHTML = "<p>Keine Produkte gefunden.</p>";
            }

        }

        //Zeigt ausschliesslich Produkte auf oder unter ihrem Mindestbestand
        function nachbestellungenAnzeigen()
        {
            let liste = document.getElementById("nachbestellListe");

            liste.innerHTML = "";

            let nachbestellAnzahl = 0;

            for (let i = 0; i < produkte.length; i++)
            {
                let produkt = produkte[i];

                if (produkt.bestand > produkt.mindestbestand)
                {
                    continue;
                }

                nachbestellAnzahl++;

                liste.innerHTML +=`
                <div>
                    <h3>${produkt.name}</h3>
                    <p>Artikelnummer: ${produkt.artikelnummer}</p>
                    <p>Barcode: ${produkt.barcode}</p>
                    <p>Aktueller Bestand: ${produkt.bestand}</p>
                    <p>Mindestbestand: ${produkt.mindestbestand}</p>
                    <p style="color: red; font-weight: bold;">Nachbestellen</p>
                </div>
                <hr>
                `;
            }

            if (nachbestellAnzahl === 0)
            {
                liste.innerHTML = "<p>Keine Nachbestellungen erforderlich.</p>";
            }
        }

        // Berechnet die Kennzahlen oberhalb der Produktliste neu.
        function übersichtAktualisieren()
        {
            let nachbestellAnzahl = 0;

            for (let i = 0; i < produkte.length; i++)
            {
                if (produkte[i].bestand <= produkte[i].mindestbestand)
                {
                    nachbestellAnzahl++;
                }
            }

            document.getElementById("übersicht").textContent = "Produkte gesamt: " + produkte.length + " | Nachbestellen: " + nachbestellAnzahl;
        }



        // Übernimmt die gewählte Sortierung und zeichnet die Produktliste erneut.
        function sortierungAendern()
        {
            sortierung = document.getElementById("sortierungAuswahl").value;
            produkteAnzeigen();
        }




        // Speichert die vollständige Produktliste dauerhaft im aktuellen Browser.
        function produkteSpeichern()
        {
            localStorage.setItem("produkte", JSON.stringify(produkte));
        }

        // Lädt vorhandene Browserdaten und ergänzt Felder aus älteren Datenständen.
        function produkteLaden()
        {
            let gespeicherteProdukte = localStorage.getItem("produkte");
            if (gespeicherteProdukte !== null)
            {
                produkte = JSON.parse(gespeicherteProdukte);

                // Ergänzt Felder, die in älteren gespeicherten Produkten noch fehlen.
                for (let i = 0; i < produkte.length; i++)
                {
                    if (produkte[i].artikelnummer === undefined)
                    {
                        produkte[i].artikelnummer = "ALT-" + (i + 1);
                    }
                    if (produkte[i].barcode === undefined)
                    {
                        produkte[i].barcode = "";
                    }
                }
                produkteSpeichern();
            }
        }



        // Erhöht den Lagerbestand des ausgewählten Produkts und speichert die Änderung.
        function bestandErhoehen(index) {
            produkte[index].bestand = produkte[index].bestand + 1;
            produkteSpeichern();
            produkteAnzeigen();
        }

        // Verringert den Lagerbestand, verhindert dabei aber negative Werte.
        function bestandVerringern(index) {

            if (produkte[index].bestand <= 0)
            {
                alert("Es sind keine negativen Bestände erlaubt!");
                return;
            }

            produkte[index].bestand = produkte[index].bestand - 1;
            produkteSpeichern();
            produkteAnzeigen();
        }

        // Löscht ein Produkt erst nach einer Sicherheitsabfrage endgültig aus der Liste.
        function produktEntfernen(index)
        {

            let produkt = produkte[index];
            let bestätigung = confirm("Möchten Sie das Produkt " + produkt.name + " wirklich löschen?");

            if(!bestätigung)
            {
                return;
            }

            produkte.splice(index, 1);
            produkteSpeichern();
            produkteAnzeigen();
        }

        // Überträgt ein Produkt in das gemeinsame Formular und aktiviert den Bearbeitungsmodus.
        function produktBearbeiten(index)
        {
            let produkt = produkte[index];
            document.getElementById("artikelnummerEingabe").value = produkt.artikelnummer;
            document.getElementById("barcodeEingabe").value = produkt.barcode;
            document.getElementById("nameEingabe").value = produkt.name;
            document.getElementById("bestandEingabe").value = produkt.bestand;
            document.getElementById("mindestbestandEingabe").value = produkt.mindestbestand;

            bearbeitungsIndex = index;

            document.getElementById("formularButton").textContent = "Produkt speichern";
            document.getElementById("nameEingabe").focus();
        }
        

        // Validiert Formulardaten und legt abhängig vom Modus ein Produkt an oder aktualisiert es.
        function produkthinzufügen()
        {
            let artikelnummer = document.getElementById("artikelnummerEingabe").value.trim();
            let barcode = document.getElementById("barcodeEingabe").value.trim();
            let name = document.getElementById("nameEingabe").value.trim();
            let bestandText = document.getElementById("bestandEingabe").value;
            let mindestbestandText = document.getElementById("mindestbestandEingabe").value;

            if(artikelnummer === "" || name === "" ||  bestandText === "" || mindestbestandText === "")
            {
                alert ("Bitte alle Felder ausfüllen!");
                return;
            }

            // Kleinschreibung macht die Prüfung auf doppelte Kennungen unabhängig von Groß-/Kleinschreibung.
            let artikelnummerVergleich = artikelnummer.toLowerCase();
            let barcodeVergleich = barcode.toLowerCase();

            // Beim Bearbeiten wird das aktuelle Produkt nicht mit sich selbst verglichen.
            for (let i = 0; i < produkte.length; i++)
            {
                if (i === bearbeitungsIndex)
                {
                    continue;
                }

                let vorhandeneArtikelnummer = produkte[i].artikelnummer.trim().toLowerCase();
                let vorhandenerBarcode = (produkte[i].barcode || "").trim().toLowerCase();

                if(vorhandeneArtikelnummer === artikelnummerVergleich)
                {
                    alert("Die Artikelnummer ist bereits vergeben!");
                    return;
                }

                // Der Barcode ist optional, muss aber eindeutig sein, sobald er angegeben wird.
                if (barcode !== "" && vorhandenerBarcode === barcodeVergleich)
                {
                    alert ("Dieser Barcode existiert bereits!")
                    return;
                    
                }

            }




            // Eingabefelder liefern Text; für Bestandsberechnungen werden echte Zahlen benötigt.
            let bestand = Number(bestandText);
            let mindestbestand = Number(mindestbestandText);

            if (bestand < 0 || mindestbestand < 0)
            {
                alert("Es sind keine negativen Zahlen erlaubt!");
                return;
            }


            let produktDaten = {
                artikelnummer: artikelnummer,
                barcode: barcode,
                name: name,
                bestand: bestand,
                mindestbestand: mindestbestand
            }


            // Dasselbe Formular legt ein Produkt an oder ersetzt das bearbeitete Produkt.
            if (bearbeitungsIndex === null) 
            {
                produkte.push(produktDaten);
            }
            else
            {
                produkte[bearbeitungsIndex] = produktDaten;
                bearbeitungsIndex = null;
            }
            
            produkteSpeichern();
            produkteAnzeigen();
            formularZurücksetzen();


           
        }

        // Leert das Formular und wechselt zurück vom Bearbeiten zum Hinzufügen.
        function formularZurücksetzen()
        {
            document.getElementById("artikelnummerEingabe").value = "";
            document.getElementById("barcodeEingabe").value = "";
            document.getElementById("nameEingabe").value = "";
            document.getElementById("bestandEingabe").value = "";
            document.getElementById("mindestbestandEingabe").value = "";

            bearbeitungsIndex = null;

            document.getElementById("formularButton").textContent = "Produkt hinzufügen";
            document.getElementById("nameEingabe").focus();
        }


        // Gespeicherte Daten müssen vor der ersten Anzeige geladen werden.
        produkteLaden();
        produkteAnzeigen();
        inventurAnzeigeAktualisieren();
    </script>
</body>
</html>
