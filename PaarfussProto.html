<!DOCTYPE html> 
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Inventur APP</title>
</head>
<body>                          <!-- HTML Code -->
    <h1>Inventur APP</h1>
    <h2>Neues Produkt hinzufügen</h2>
                                            <!-- Formular zum Hinzufügen eines neuen Produkts -->
    <input id="artikelnummerEingabe" placeholder="Artikelnummer"/>
    <input id="nameEingabe" placeholder="Produktname"/>
    <input id="bestandEingabe" placeholder="Bestand" type="number"/>
    <input id="mindestbestandEingabe" placeholder="Mindestbestand" type="number"/>
    <button id ="formularButton" onclick="produkthinzufügen()"> Produkt hinzufügen </button>
    <button onclick="formularZurücksetzen()">Abbrechen</button>

    <h2>Produktliste</h2>                    <!--Überschrift für die Produktliste-->
                                <!--Suchfeld und Sortierungsauswahl-->
    <input id="sucheEingabe" placeholder="Suchen..." oninput="produkteAnzeigen()"> 
    <select id="sortierungAuswahl" onchange="sortierungAendern()">
        <option value="name">Nach Name sortieren</option>
        <option value="bestand">Nach Bestand sortieren</option>
        <option value="nachbestellen">Nachbestellen zuerst</option>
    </select>

    <p id="übersicht"></p>              

    <label>             <!-- Checkbox zum Filtern der Produktliste, um nur Produkte anzuzeigen, die nachbestellt werden müssen-->
        <input id="nurNachbestellen" type = "checkbox" onchange="produkteAnzeigen()"/>
        Nur Nachbestellen anzeigen
    </label>


    <div id="produktListe"></div>               <!-- Container für die Produktliste -->

    <script>                                 //JavaScript Code 
        let produkte = standardProdukte();                 // Variable zum Speichern der Produkte

        let bearbeitungsIndex = null;               // Variable zum Speichern des Index des Produkts, das gerade bearbeitet wird
        let sortierung = "name";  // Variable zum Speichern der aktuellen Sortierung
        
        function standardProdukte()         // Funktion zum Erstellen der Standardprodukte
        {
            return[
                                              
            {
                artikelnummer: "FC-001",
                name: "Fußcreme",
                bestand: 5,
                mindestbestand: 2
            },
            {
                artikelnummer: "HS-001",
                name: "Handschuhe",
                bestand: 20,
                mindestbestand: 10
            },
            {
                artikelnummer: "DES-001",
                name: "Desinfektionsmittel",
                bestand: 3,
                mindestbestand: 4
            }
        
            ];
        }

        
        function produkteAnzeigen() {                               // Funktion zum Anzeigen der Produkte
            übersichtAktualisieren();

            let liste = document.getElementById("produktListe");                        // Container für die Produktliste
            let suchText = document.getElementById("sucheEingabe").value.toLowerCase();     // Suchtext aus dem Suchfeld
            let nurNachbestellen = document.getElementById("nurNachbestellen").checked;          // Checkbox zum Filtern der Produktliste, um nur Produkte anzuzeigen, die nachbestellt werden müssen

            liste.innerHTML = "";  // Leeren des Containers für die Produktliste

            let angezeigteAnzahl = 0;       // Variable zum Zählen der angezeigten Produkte

            let angezeigteProdukte = [...produkte];     // Kopieren des Arrays von Produkten, um die Sortierung und Filterung zu ermöglichen


            if (sortierung === "name")      // Sortieren der Produkte nach Name
            {
                angezeigteProdukte.sort(function(a, b)
                {return a.name.localeCompare(b.name)});
            }

            if (sortierung === "bestand")       // Sortieren der Produkte nach Bestand
            {
                angezeigteProdukte.sort(function(a, b)
                {return a.bestand - b.bestand});
            }

            if(sortierung === "nachbestellen")          // Sortieren der Produkte nach Nachbestellen
            {
                angezeigteProdukte.sort(function(a, b)
                {   let aMussNachbestelltWerden = a.bestand <= a.mindestbestand;
                    let bMussNachbestelltWerden = b.bestand <= b.mindestbestand;
                    return (bMussNachbestelltWerden - aMussNachbestelltWerden)
                });
            }



            for (let i = 0; i < angezeigteProdukte.length; i++) {       // Schleife zum Durchlaufen der angezeigten Produkte
                let produkt = angezeigteProdukte[i];

                let originalIndex = produkte.indexOf(produkt);

                if(!produkt.name.toLowerCase().includes(suchText))
                {
                    continue;
                }

                if(nurNachbestellen && produkt.bestand > produkt.mindestbestand)
                {
                    continue;
                }

                let status = "";

                if (produkt.bestand <= produkt.mindestbestand) {
                    status = "Nachbestellen";
                }

                angezeigteAnzahl++;

                liste.innerHTML += `                                                                              
                    <div>
                        <h2>${produkt.name}</h2>
                        <p>Bestand: ${produkt.bestand}</p>
                        <p>Mindestbestand: ${produkt.mindestbestand}</p>
                        <p style="color: red; font-weight: bold;">${status}</p>
                            
                        <button onclick="bestandErhoehen(${originalIndex})">+</button> <!-- Buttons zum Erhöhen, Verringern, Löschen und Bearbeiten der Produkte -->
                        <button onclick="bestandVerringern(${originalIndex})">-</button>
                        <button onclick="produktEntfernen(${originalIndex})">Löschen</button>
                        <button onclick="produktBearbeiten(${originalIndex})">Bearbeiten</button>
                    </div>
                    <hr>
                `;
            }

            if (angezeigteAnzahl === 0) 
            {
                liste.innerHTML = "<p>Keine Produkte gefunden.</p>";
            }

        }

        function übersichtAktualisieren()                                   // Funktion zum Aktualisieren der Übersicht
        {
            let nachbestellAnzahl = 0;

            for (let i = 0; i < produkte.length; i++)
            {
                if (produkte[i].bestand <= produkte[i].mindestbestand)
                {
                    nachbestellAnzahl++;
                }
            }

            document.getElementById("übersicht").textContent = "Produkte gesamt: " + produkte.length + " | Nachbestellen: " + nachbestellAnzahl;
        }



        function sortierungAendern()                // Funktion zum Ändern der Sortierung
        {
            sortierung = document.getElementById("sortierungAuswahl").value;
            produkteAnzeigen();
        }




        function produkteSpeichern()                // Funktion zum Speichern der Produkte im Local Storage
        {
            localStorage.setItem("produkte", JSON.stringify(produkte));
        }

        function produkteLaden()                // Funktion zum Laden der Produkte aus dem Local Storage
        {
            let gespeicherteProdukte = localStorage.getItem("produkte");
            if (gespeicherteProdukte !== null)
            {
                produkte = JSON.parse(gespeicherteProdukte);
            }
        }



        function bestandErhoehen(index) {                   // Funktion zum Erhöhen des Bestands eines Produkts
            produkte[index].bestand = produkte[index].bestand + 1;
            produkteSpeichern();
            produkteAnzeigen();
        }

        function bestandVerringern(index) {                 // Funktion zum Verringern des Bestands eines Produkts

            if (produkte[index].bestand <= 0)
            {
                alert("Es sind keine negativen Bestände erlaubt!");
                return;
            }

            produkte[index].bestand = produkte[index].bestand - 1;
            produkteSpeichern();
            produkteAnzeigen();
        }

        function produktEntfernen(index)            // Funktion zum Entfernen eines Produkts
        {

            let produkt = produkte[index];
            let bestätigung = confirm("Möchten Sie das Produkt " + produkt.name + " wirklich löschen?");

            if(!bestätigung)
            {
                return;
            }

            produkte.splice(index, 1);
            produkteSpeichern();
            produkteAnzeigen();
        }

        function produktBearbeiten(index)               // Funktion zum Bearbeiten eines Produkts
        {
            let produkt = produkte[index];
            document.getElementById("nameEingabe").value = produkt.name;
            document.getElementById("bestandEingabe").value = produkt.bestand;
            document.getElementById("mindestbestandEingabe").value = produkt.mindestbestand;

            bearbeitungsIndex = index;

            document.getElementById("formularButton").textContent = "Produkt Speichern";
            document.getElementById("nameEingabe").focus();
        }
        

        function produkthinzufügen()            // Funktion zum Hinzufügen eines neuen Produkts oder Speichern der Änderungen eines bestehenden Produkts
        {
            let name = document.getElementById("nameEingabe").value.trim();
            let bestandText = document.getElementById("bestandEingabe").value;
            let mindestbestandText = document.getElementById("mindestbestandEingabe").value;

            if(name === "" || bestandText === "" || mindestbestandText === "")
            {
                alert ("Bitte alle Felder ausfüllen!");
                return;
            }

            let bestand = Number(bestandText);
            let mindestbestand = Number(mindestbestandText);

            if (bestand < 0 || mindestbestand < 0)
            {
                alert("Es sind keine Negativen Zahlen erlaubt!");
                return;
            }


            let produktDaten = {
                name: name,
                bestand: bestand,
                mindestbestand: mindestbestand
            }


            if (bearbeitungsIndex === null) 
            {
                produkte.push(produktDaten);
            }
            else
            {
                produkte[bearbeitungsIndex] = produktDaten;
                bearbeitungsIndex = null;
            }
            
            produkteSpeichern();
            produkteAnzeigen();
            formularZurücksetzen();


           
        }

        function formularZurücksetzen()             // Funktion zum Zurücksetzen des Formulars
        {
            document.getElementById("nameEingabe").value = "";
            document.getElementById("bestandEingabe").value = "";
            document.getElementById("mindestbestandEingabe").value = "";

            bearbeitungsIndex = null;

            document.getElementById("formularButton").textContent = "Produkt hinzufügen";
            document.getElementById("nameEingabe").focus();
        }


        produkteLaden();
        produkteAnzeigen();
    </script>
</body>
</html>
